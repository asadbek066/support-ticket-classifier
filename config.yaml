categories:
  - Billing & Payments
  - Account Access Issues
  - Technical Problems
  - Feature Requests
  - Product Usage Questions
  - Security Concerns
  - Cancellations & Refunds
  - Other / Needs Review

queue_map:
  Billing & Payments: billing-queue
  Account Access Issues: account-ops
  Technical Problems: tech-support
  Feature Requests: product-team
  Product Usage Questions: support-general
  Security Concerns: security-ops
  Cancellations & Refunds: refunds
  Other / Needs Review: triage

rules:
  forced_human_review_categories:
    - Security Concerns
  confidence_threshold: 0.65
  enterprise_confidence_boost: 0.1

ollama:
  model: deepseek-r1:1.5b
  api_url: http://localhost:11434/api/generate

# Audit log bounds. Records keep a truncated copy of each ticket text field plus
# the full-text SHA-256 and length; see README "Audit log storage".
audit:
  max_text_chars: 300          # per ticket text field; 0 stores no ticket text
  store_full_text: false       # true stores complete ticket text (privacy risk)
  retention_days: 30           # delete audit files older than this
  max_total_mb: 200            # total audit directory cap; oldest files go first
  max_daily_mb: 20             # per-day file cap; further records are dropped
  prune_interval_seconds: 3600 # retention sweep at most this often during writes

# Abuse bounds for /classify and /classify-batch (in-process, per worker).
rate_limit:
  enabled: true
  tickets_per_minute: 300      # sustained refill per client address; a batch costs one per ticket
  burst: 200                   # bucket size; must be >= 100 so one full batch can pass
  max_clients: 10000           # tracked client addresses (least recently used evicted)

provider_queue:
  max_depth: 32                # requests allowed to wait when all 4 model slots are busy
  max_wait_seconds: 30         # then the marked "provider_busy" fallback is returned
